# ---------------------------------------------------------------------------
# Site
# ---------------------------------------------------------------------------
title                : "Aymen Sekhri"
# Kept short: it lands in the <title>, which search results truncate near 60.
tagline              : "PhD researcher — perceptual AI & image quality"
description          : >-
  Aymen Sekhri is a PhD researcher (cotutelle, University of Poitiers & NTNU)
  working on perceptual image quality assessment for augmented reality and
  trustworthy computer vision for medical imaging.
url                  : "https://asekhri.me"
baseurl              : ""
repository           : "AymenSe/AymenSe.github.io"
locale               : "en_US"
timezone             : Europe/Paris

author:
  name               : "Aymen Sekhri"
  short_name         : "Aymen"
  avatar             : "/images/profile.png"
  role               : "PhD researcher in machine learning & computer vision"
  location           : "Poitiers, France · Gjøvik, Norway"
  affiliation        : "XLIM, University of Poitiers · Colourlab, NTNU"
  email              : "aymen.sekhri@univ-poitiers.fr"

# Shown as icon links in the header and footer. Comment out a line to hide it.
links:
  - name   : "Email"
    icon   : "mail"
    url     : "mailto:aymen.sekhri@univ-poitiers.fr"
  - name   : "Google Scholar"
    icon   : "scholar"
    url    : "https://scholar.google.com/citations?user=n70fgO4AAAAJ"
  - name   : "GitHub"
    icon   : "github"
    url    : "https://github.com/AymenSe"
  - name   : "LinkedIn"
    icon   : "linkedin"
    url    : "https://www.linkedin.com/in/aymensekhri1/"
  - name   : "ORCID"
    icon   : "orcid"
    url    : "https://orcid.org/0000-0002-0958-9478"

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
collections:
  publications:
    output: true
    permalink: /publications/:name/

# No catch-all layout default: a `type`-less scope would also match
# assets/css/main.scss and wrap the stylesheet in the page layout.
# Pages declare their own layout in front matter.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: publications
    values:
      layout: publication

include:
  - _pages
  - files

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - node_modules

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

sass:
  style: compressed

permalink: /blog/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

# /feed.xml carries blog posts (empty until _posts has something).
# The publications feed is the one worth subscribing to, so it is what the
# footer and the <link rel="alternate"> point at.
feed:
  path: /feed.xml
  collections:
    publications:
      path: /publications.xml
