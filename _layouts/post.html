---
layout: default
---
<article class="post">
  <p class="eyebrow"><a href="{{ '/blog/' | relative_url }}">← All writing</a></p>
  <h1 class="page-head__title">{{ page.title }}</h1>
  <p class="page-head__subtitle">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
  </p>
  <div class="prose">
    {{ content }}
  </div>
</article>
